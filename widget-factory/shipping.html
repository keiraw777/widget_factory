<!DOCTYPE html>
<html lang="en" class="mdui-theme-auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Widget Store: Shipping</title>

  <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css" />
  <script src="https://unpkg.com/mdui@2/mdui.global.js" defer></script>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
  />

  <style>
    * { box-sizing: border-box; }
    #content { margin-top: 64px; padding: 16px; padding-bottom: 80px; }
  </style>
  <link id="theme-css" rel="stylesheet" href="light.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <mdui-top-app-bar>
    <mdui-button-icon
      icon="arrow_back"
      aria-label="Go back"
      onclick="location.href='index.html'"
    ></mdui-button-icon>

    <mdui-top-app-bar-title>Order</mdui-top-app-bar-title>
    <div style="flex-grow: 1;"></div>

    <mdui-button-icon
      id="themeToggle"
      icon="dark_mode"
      aria-label="Toggle dark mode"
    ></mdui-button-icon>
  </mdui-top-app-bar>

  <div id="content">
    <div class="section-title">Shipping</div>

    <div class="sub-title">Address</div>
    <div class="field-group">
      <mdui-text-field
        label="Street Address"
        id="street"
        required
      ></mdui-text-field>

      <mdui-text-field
        label="City"
        id="city"
        required
      ></mdui-text-field>

      <mdui-text-field
        label="State"
        id="state"
        required
      ></mdui-text-field>

      <mdui-text-field
        label="ZIP Code"
        id="zip"
        helper="5 digit US ZIP"
        maxlength="5"
        required
      ></mdui-text-field>
    </div>

    <div class="sub-title">Shipping Speed</div>
    <div class="shipping-options">
      <label class="shipping-option">
        <input
          type="radio"
          name="shipping"
          value="Express"
          data-cost="15.99"
          data-days="1"
        />
        Express Shipping (1 day, $15.99)
      </label>

      <label class="shipping-option">
        <input
          type="radio"
          name="shipping"
          value="Standard"
          data-cost="3.99"
          data-days="5"
          checked
        />
        Standard Shipping (5 days, $3.99)
      </label>

      <label class="shipping-option">
        <input
          type="radio"
          name="shipping"
          value="Slow"
          data-cost="0.99"
          data-days="10"
        />
        Slow Shipping (10 days, $0.99)
      </label>
    </div>

    <div class="place-order-row">
      <mdui-button variant="text" href="index.html">Cancel</mdui-button>
      <mdui-button id="placeOrderBtn" onclick="placeOrder()">Place Order</mdui-button>
    </div>
  </div>

  <script>
    function placeOrder() {
      const street = document.getElementById('street').value.trim();
      const city = document.getElementById('city').value.trim();
      const state = document.getElementById('state').value.trim();
      const zip = document.getElementById('zip').value.trim();
      const selectedShipping = document.querySelector('input[name="shipping"]:checked');

      if (!street || !city || !state || !zip) {
        alert('Please fill out all shipping fields.');
        return;
      }

      const shippingInfo = {
        street,
        city,
        state,
        zip,
        method: selectedShipping.value,
        cost: Number(selectedShipping.dataset.cost),
        days: Number(selectedShipping.dataset.days)
      };

      localStorage.setItem('shippingInfo', JSON.stringify(shippingInfo));

      const btn = document.getElementById('placeOrderBtn');
      btn.loading = true;

      setTimeout(() => {
        location.href = 'summary.html';
      }, 800);
    }

        const html = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const themeLink = document.getElementById('theme-css');

    function applyTheme(isDark) {
      html.classList.remove('mdui-theme-light', 'mdui-theme-dark', 'mdui-theme-auto');
      html.classList.add(isDark ? 'mdui-theme-dark' : 'mdui-theme-light');
      themeLink.href = isDark ? 'dark.css' : 'light.css';
      toggle.icon = isDark ? 'light_mode' : 'dark_mode';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // On load: check saved preference or OS preference
    const saved = localStorage.getItem('theme');
    if (saved) {
      applyTheme(saved === 'dark');
    } else {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark);
    }

    toggle.addEventListener('click', () => {
      const isDark = html.classList.contains('mdui-theme-dark');
      applyTheme(!isDark);
    });
  </script>
  <mdui-navigation-bar id="main-nav" value="shipping">
    <mdui-navigation-bar-item icon="storefront" value="store" href="index.html">Store</mdui-navigation-bar-item>
    <mdui-navigation-bar-item icon="local_shipping" value="shipping" href="shipping.html">Shipping</mdui-navigation-bar-item>
    <mdui-navigation-bar-item icon="receipt_long" value="summary" href="summary.html">Summary</mdui-navigation-bar-item>
  </mdui-navigation-bar>
</body>
</html>
